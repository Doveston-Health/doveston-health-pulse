name: PUL-008 quality workflow

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: PUL-008 quality workflow
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pulse_test
          POSTGRES_PASSWORD: pulse_test_only
          POSTGRES_DB: pulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse_test -d pulse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      LOG_LEVEL: silent
      SESSION_SECRET: pulse_ci_test_only_session_secret
      DATABASE_URL: postgresql://pulse_test:pulse_test_only@localhost:5432/pulse_test?schema=public
      CLINIKO_ENABLED: "false"
      XERO_ENABLED: "false"

    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint

      - name: Run automated tests
        run: npm test

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Deploy migrations to clean PostgreSQL
        run: npm run db:migrate:deploy

      - name: Validate migration status
        run: npm run db:migrate:check

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" --output gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Scan repository history for credentials
        run: gitleaks git --redact --verbose .

